  also applies. Use the cookie jar, not an API-key header. Do not export populated
  environments or saved auth responses.


  Set allow_operation to AuthController_login for this one manual request. Mutates
  state: also requires allow_mutations=true and applicable human authorization. Never
  run mutations in Collection Runner.'
