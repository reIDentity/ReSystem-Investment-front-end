    \ target = pm.variables.get('baseUrl');\nif (!/^https:\\/\\/[^/?#@]+(?::[0-9]+)?$/.test(target\
    \ || '')) {\n  pm.execution.skipRequest(); throw new Error('Use an HTTPS origin\
    \ without a path or credentials.');\n}\nif (pm.variables.get('allow_operation')\
    \ !== \"AuthController_challenge\") {\n  pm.execution.skipRequest();\n}\nif (pm.variables.get('allow_mutations')\
    \ !== 'true') {\n  pm.execution.skipRequest();\n}"
  language: text/javascript
order: 12000
