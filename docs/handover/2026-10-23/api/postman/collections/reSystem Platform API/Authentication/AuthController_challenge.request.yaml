  Bodies are editable contract examples, not captured live requests. Exact per-action
  validation also applies. Use the cookie jar, not an API-key header. Do not export
  populated environments or saved auth responses.


  Set allow_operation to AuthController_challenge for this one manual request. Mutates
  state: also requires allow_mutations=true and applicable human authorization. Never
  run mutations in Collection Runner.


  Legacy/policy-dependent route. Personal staff signing is permanently disabled; use
  the shared admin flow.'
url: '{{baseUrl}}/v1/auth/wallet/challenge'
method: POST
