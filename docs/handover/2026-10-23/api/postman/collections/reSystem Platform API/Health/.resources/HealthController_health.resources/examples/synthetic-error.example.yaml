$kind: http-example
name: Synthetic 400 envelope - not a captured response
request:
  method: GET
  url: '{{baseUrl}}/health'
response:
  statusCode: 400
  statusText: Bad Request
  headers:
  - key: Content-Type
    value: application/json
  body:
    type: json
    content: "{\n  \"error\": {\n    \"code\": \"EXAMPLE_ONLY\",\n    \"message\"\
      : \"Illustrative error; inspect the actual response.\"\n  },\n  \"statusCode\"\
      : 400\n}"
